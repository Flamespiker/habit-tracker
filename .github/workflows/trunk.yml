name: Trunk Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  trunk:
    name: Trunk Code Quality
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: trunk-io/trunk-action@v1
