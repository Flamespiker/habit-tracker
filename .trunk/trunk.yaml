version: 0.1

cli:
  version: 1.22.6

plugins:
  sources:
    - id: trunk
      ref: v1.6.6
      uri: https://github.com/trunk-io/plugins

runtimes:
  enabled:
    - node@18.20.5
    - python@3.10.8

lint:
  enabled:
    - eslint@9.39.4
    - prettier
    - checkov@3.2.334

  ignore:
    - linters: [ALL]
      paths:
        - node_modules/**
        - .next/**
        - out/**
    - linters: [prettier]
      paths:
        - .claude/**
        - src/scripts/**
        - src/lib/types/**

actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
